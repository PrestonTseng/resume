        highlights:
          - Lead a 3-5 engineer cloud team across timetabling, mission management, safety-control workflows, and observability, owning cross-service architecture and partnering with the CEO on roadmap and KPI planning.
          - Designed a human-reviewed interview pipeline used for 13 candidates, replacing PowerPoint/Excel handoffs with version-controlled Confluence records and cutting an estimated 90% of HR coordination overhead.
