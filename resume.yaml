          - Lead a 3-5 engineer cloud team responsible for timetabling, mission management, safety-control workflows, and observability. Own architecture across services and work with the CEO on roadmaps and KPIs.
          - Standardized how the cloud team turns specifications into delivery plans. Connected architecture decisions, owners, dependencies, Jira tasks, and release commitments through verified Confluence and Jira workflows.
