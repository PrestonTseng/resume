        highlights:
          - Built a testbed timetabling stack that has run a recurring 1,351-service weekend schedule over a 02:00-23:30 daily horizon for several months, detecting full-day conflicts in 1-3 seconds against a topology snapshot containing 34 routes, 28 blocks, and 51 sub-blocks.
          - Re-architected the Safety Server within LILEE's cloud control platform from a stateless service into stateful Core Services and Mission Execution layers with explicit mission FSM and Movement Authority lifecycle, making previously opaque testbed failures traceable within seconds through Grafana.
          - Designed Faramund, a 28-state breakdown-recovery FSM that automatically clears testbed recovery conditions over WebSocket, eliminating the need for continuous 24-hour human monitoring.
          - Built seshat-go, a Go and TimescaleDB service recording 14 MQTT topics across a 14-day, approximately 300 GB testbed history window, enabling engineers to replay module state and reconstruct cross-module incidents.
          - Built a release-gated Playwright/Jenkins pipeline from scratch and governed a team-authored 86-case regression plan; the gate initially caught 1-2 bugs per build and helped establish pre-push testing, making later release findings rare within about a month.
