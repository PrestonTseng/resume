  - id: lilee-ai-interview-pipeline
    title: Agent-assisted interview pipeline
    role_id: lilee-tech-lead
    timeframe: 2026-04 to present
    summary: Designed an agent-assisted hiring workflow from resume review through final interview.
    facts:
      - Pipeline generates traceable review records from resume review through final interview.
      - Workflow reduces coordination overhead with HR.
      - Review artifacts are designed to be traceable and auditable.
      - Resume evidence is compared against live hiring plans and role-specific JDs rather than a remembered generic rubric.
      - The workflow separates observed evidence, inference, risk, recommendation, and follow-up questions.
      - Stage gates cover resume review, HR screening, role-specific technical evaluation, and later decision records.
      - Candidate tracking pages use structured scores, comments, source references, controlled write approval, and persisted-layout verification.
      - Before the workflow, HR maintained shared PowerPoint candidate data and Excel scores; interviewers sent materials to Preston, who had to review, update both files at each stage, and send them back.
      - The current workflow lets the agent update version-controlled Confluence records automatically, leaving email notification and human review/advancement as the coordination path.
      - The workflow has processed 13 candidates.
    metrics:
      confirmed:
        - name: hr_coordination_overhead_reduction
          value: approximately 90%
          basis: user estimate from replacing repeated PowerPoint/Excel updates and file exchanges with agent-maintained Confluence records and email notification
        - name: candidates_processed
          value: 13
    technologies:
