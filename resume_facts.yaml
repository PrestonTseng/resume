  - id: lilee-playwright-jenkins
    title: Release-gated E2E CI pipeline and test-plan governance
    role_id: lilee-full-stack-engineer
    timeframe: 2024-05 to 2026-03
    summary: Built the Jenkins release gate, reviewed and curated the team-authored E2E plan, and governed release quality while a teammate implemented the Playwright automation.
    facts:
      - Built the Jenkins release gate around the Playwright automation.
      - CI blocks image publishing when the suite fails.
      - Catches regressions before they reach QA.
      - Team members continue to expand the regression suite; Preston reviews and curates the test plan, and Lorenzo implemented the automation.
      - The suite contained 99 automated cases as of 2026-08-07 and is expected to exceed 100 in a later release; this count is volatile and should not be used in stable resume wording.
      - The suite runs after every release build.
      - During initial adoption, each build typically exposed one or two bugs; after about one month, findings became rare as developers began testing before pushing code.
      - A June 2026 SafeART release evidence set records 86 passed automated cases spanning timetable/service CRUD, conflict detection, audit, realtime vehicle/track/signal/conflict views, manual mode, cross-day handling, severity events, DOM, vehicle management, and user management.
    metrics:
