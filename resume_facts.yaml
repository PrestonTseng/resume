          value: 86
          basis: live SafeART 0.20 release-note evidence summarized on 2026-06-25
        - name: current_automated_case_count
          value: 99
          observed_at: 2026-08-07
          volatility: changes frequently as the team expands the suite
        - name: initial_regressions_caught_per_build
          value: 1-2 bugs
          basis: typical result during initial adoption
        - name: gate_frequency
          value: every release build
        - name: later_regression_trend
          value: findings became rare after approximately one month
          basis: developers adopted pre-push testing
