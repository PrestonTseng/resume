    summary: Built a Go + TimescaleDB service to record MQTT traffic and replay module state for cross-module incident debugging.
    facts:
      - Built seshat-go from scratch.
      - The Go backend and React frontend PoC records configurable MQTT topics into PostgreSQL/TimescaleDB as raw JSONB with compression and retention policies.
      - Its source snapshot states that it subscribes to MQTT traffic and supports ICD message types 1 through 19.
      - The current deployment records 19 MQTT topics.
      - Provides time-range/topic queries, payload-field filtering, multi-topic comparison, and track-map/state replay for historical incident analysis.
      - Makes cross-module incidents debuggable for the team.
      - Operates as an observer and is not a TAPAS runtime dependency or part of the operational control path.
    metrics:
      confirmed:
        - name: known_icd_message_type_scope
          value: types 1 through 19
          basis: Seshat source snapshot and Seshat 2.0 terminology
        - name: captured_mqtt_topics
          value: 19 topics
          basis: Direct user confirmation on 2026-08-07.
        - name: retention_period
          value: 14 days
          basis: Retention policy chosen for the available 300 GB VM capacity.
        - name: storage_capacity_for_retention_window
          value: approximately 300 GB
          basis: The VM's available storage is approximately full after 14 days; this is a capacity constraint, not an impact metric.
      derived_estimates:
        - name: average_storage_growth
          value: approximately 21.4 GB/day
          calculation: 300 GB / 14 days
          boundary: Storage growth estimate; not a measured MQTT network throughput rate and may include database/index overhead.
      needs_followup:
        - Measured MQTT message throughput, if available.
        - Debug time or MTTR improvement.
        - Number of modules covered.
    technologies:
      - Go
      - TimescaleDB
      - MQTT
      - PostgreSQL
    themes:
      - observability
      - event replay
      - incident response
      - distributed systems
    target_roles:
      - Platform Engineer
      - Backend Engineer
      - Tech Lead
      - Observability Engineer
    public_safe: true
    boundaries:
      - Current source states testbed traffic; do not imply production unless confirmed.
      - Seshat observes and analyzes MQTT traffic; it has no runtime authority over SS, JPS, MMS, WSS, ADS, or TriOps.
      - The 19 captured topics are a direct current-deployment count; keep this separate from the ICD message-type range.
      - The 21.4 GB/day figure is derived from storage capacity and retention, not a measured broker throughput value.
      - The 14-day retention period and approximately 300 GB window reflect VM capacity, not service performance or business impact.
    sources:
      - kb://plans/2026-07-02-leo-seshat-spec/page-snapshot.md
      - kb://plans/2026-07-02-leo-seshat-spec/seshat-2.0-draft-v1.md
