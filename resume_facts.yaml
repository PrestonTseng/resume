  - id: lilee-safety-server
    title: Safety Server stateful architecture
    role_id: lilee-full-stack-engineer
    timeframe: 2024-05 to 2026-03
    summary: Re-architected Safety Server from stateless service into two-tier stateful system with mission FSM and Movement Authority lifecycle.
    facts:
      - Re-architected Safety Server from a stateless service into a two-tier stateful system.
      - Architecture separates Core Services and Mission Execution.
      - Introduced explicit mission FSM and Movement Authority lifecycle.
      - Made silently stuck missions debuggable in seconds via Grafana.
      - Safety Server route-request ordering changes selection logic inside Safety Server; it does not change WSS/PLC authorization behavior or preempt an already authorized route.
      - For TSR/Form A/Form B, Safety Server owns the operational golden copy, timer-driven state transitions, validation, and Movement Authority integration, while JPS is the dispatcher API gateway and long-term history/audit persistence layer.
      - The WSS agent subscribes to Safety Server route/door commands over MQTT, translates them into Modbus register state for PLC/IXL, and applies failsafe marking when commands stop arriving.
      - ADS receives Movement Authority commands from Safety Server over WebSocket and returns MA acknowledgements; the existing MA payload remains the vehicle-facing contract for TSR/Form A/Form B.
      - The architecture is used in Alpha and pre-alpha testbeds.
      - Before the observability/state-management improvement, a stuck mission could remain blocked and eventually fail.
    metrics:
      confirmed:
        - name: stuck_mission_debuggability
          value: debuggable in seconds via Grafana
        - name: deployment_scope
          value: Alpha and pre-alpha testbeds
      needs_followup:
        - Quantitative diagnosis or recovery time before and after the architecture change, if available.
        - Audit log, rollback, manual override, timeout, and idempotency details safe to disclose.
    technologies:
      - Python
      - FastAPI
      - GraphQL
      - SQLAlchemy
      - asyncio
      - Grafana
    themes:
      - safety-critical systems
      - stateful architecture
      - FSM design
      - observability
      - incident debugging
    target_roles:
      - Tech Lead
      - Platform Engineer
      - Backend Engineer
      - Safety-critical Systems Engineer
    public_safe: true
    boundaries:
      - Use boundary language such as within LILEE's cloud control platform.
      - Safety Server owns cloud-side mission selection, operational restriction state, and Movement Authority integration; WSS/PLC remains a separate authorization and field-control boundary.
      - ADS/vehicle-side software consumes and acknowledges MA; do not imply that Safety Server alone provides final field or onboard enforcement.
    sources:
      - kb://plans/2026-06-08-leo-po-example-from-n4bi4q/plan.md
      - kb://plans/2026-07-14-leo-tsr-ws6-ticket-audit/spec_page_text.md
      - kb://plans/2026-07-08-leo-wss-agent-architecture/wss-agent-architecture.md
      - kb://plans/2026-07-23-leo-tapas-testbed-mock-ads-triops/spec-v2.md
      - direct_user_confirmation:2026-08-04
    resume_bullets:
      default: Re-architected the Safety Server from a stateless service into a two-tier stateful system with explicit mission FSM and Movement Authority lifecycle, turning silently stuck missions into Grafana-traceable incidents debuggable within seconds.
      safety_boundary: Re-architected the Safety Server within LILEE's cloud control platform into a stateful Core Services + Mission Execution architecture with explicit mission FSM, Movement Authority lifecycle, and observable command-state transitions.

  - id: lilee-faramund
    title: Faramund breakdown-recovery agent
    role_id: lilee-full-stack-engineer
    timeframe: 2024-05 to 2026-03
    summary: Built a testbed recovery agent that simulates a dispatcher, coordinates with a driver agent and wayside signals, guides failed vehicles back to the yard, and notifies the team without continuous human monitoring.
    facts:
      - Designed Faramund, the platform's breakdown-recovery agent.
      - Faramund is an agent that simulates the dispatcher role in the testbed.
      - The driver is modeled as a separate agent that communicates with Faramund in real time.
      - Faramund controls and opens wayside signals in the testbed to guide a failed vehicle back to the yard.
      - Uses a 28-state FSM.
      - Orchestrates cloud services and field operators over WebSocket.
      - Replaced a testbed recovery model that required one person to monitor operations continuously, 24 hours a day.
      - After the change, the testbed can clear recovery conditions automatically and notify the team without operator approval.
      - Owns DOM 10 recovery in the documented mission-ordering context, where recovery traffic is distinguished from normal dispatch and return-to-yard intent.
    metrics:
      confirmed:
        - name: fsm_state_count
          value: 28 states
        - name: continuous_human_monitoring_before
          value: one person, 24 hours per day
        - name: operator_approval_required_after
          value: false
        - name: deployment_scope
          value: testbed
      needs_followup:
        - Frequency of recovery events and avoided manual interventions, if tracked.
    technologies:
      - WebSocket
      - FSM design
      - Agent-based simulation
      - Wayside signaling
      - Real-time communication
    themes:
      - workflow automation
      - incident recovery
      - human-in-the-loop operations
      - autonomous rail
    target_roles:
      - Tech Lead
      - Platform Engineer
      - AI Operations
      - Full Stack Engineer
    public_safe: true
    boundaries:
      - This is testbed recovery automation and does not require operator approval; do not imply production deployment.
      - Faramund and the driver are simulated operational roles; do not imply that Faramund replaces certified field-safety authority.
    sources:
